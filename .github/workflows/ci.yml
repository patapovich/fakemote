name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install g++ and stripios
        run: |
          sudo apt-get update -y && sudo apt-get install -y g++ wget
          wget -q https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp
          g++ main.cpp -o stripios
          mv stripios ${DEVKITPRO}/tools/bin
      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE:FILEPATH=$DEVKITPRO/cmake/devkitARM.cmake ..
          make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FAKEMOTE-v051-gca
          if-no-files-found: error
          path: build/FAKEMOTE.app
