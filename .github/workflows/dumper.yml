name: Build-memlog-dumper
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dumper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Build
        run: |
          mkdir -p proj/source && cd proj
          echo "" | base64 -d > source/main.c
          echo "" | base64 -d > Makefile
          make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: memlog-dumper
          path: proj/boot.dol
